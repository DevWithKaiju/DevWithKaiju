  <text x="30" y="72" font-size="30" fill="#27222c" text-anchor="start" font-weight="800" font-family="'Arial Narrow', 'Helvetica Neue Condensed', Arial, sans-serif" >Teaching machines</text>
  <text x="30" y="104" font-size="30" fill="#27222c" text-anchor="start" font-weight="800" font-family="'Arial Narrow', 'Helvetica Neue Condensed', Arial, sans-serif" >to read the literature.</text>
  <text x="30" y="140" font-size="15" fill="#27222c" text-anchor="start" font-weight="normal" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" >I&#8217;m a master&#8217;s student at the Graduate School of Pharmaceutical Sciences,</text>
