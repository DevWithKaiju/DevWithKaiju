<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 420 320">
  <defs>
    <linearGradient id="purpleMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="purpleMintGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.6" />
    </linearGradient>
    
    <linearGradient id="xpBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, sans-serif; }
    
    @keyframes float {
      0% { transform: translate(var(--cx), calc(var(--cy) - 3px)); }
      50% { transform: translate(var(--cx), calc(var(--cy) + 3px)); }
      100% { transform: translate(var(--cx), calc(var(--cy) - 3px)); }
    }
    .kaiju-art {
      animation: float 3s ease-in-out infinite;
    }
    
  </style>
  <rect x="0" y="0" width="420" height="320" rx="16" fill="#FFFFFF" />
  <rect x="0" y="0" width="420" height="320" rx="16" fill="none" stroke="url(#cardBorderGrad)" stroke-width="1.5" />
  <text x="210.0" y="30" font-size="17" fill="#8870a4" text-anchor="middle" font-weight="700" >Junior Kaiju</text>
  <rect x="180.0" y="38" width="60" height="22" rx="11" fill="#FFFFFF" stroke="url(#purpleMintGrad)" stroke-width="1.2" />
  <text x="210.0" y="54" font-size="11" fill="#8870a4" text-anchor="middle" font-weight="700" >Lv. 23</text>
  <g class="kaiju-art" style="--cx: 210.0px; --cy: 150px;" transform="translate(210.0,150)">
    <image x="-70.0" y="-70.0" width="140" height="140" href="data:image/png;base64," xlink:href="data:image/png;base64," />
  </g>
  <circle cx="40" cy="90" r="3" fill="#b39cd0" opacity="0.4" />
  <circle cx="380" cy="100" r="2.5" fill="#2dd4bf" opacity="0.5" />
  <circle cx="60" cy="250" r="2" fill="#FFD6E5" opacity="0.6" />
  <circle cx="360" cy="240" r="3.5" fill="#b39cd0" opacity="0.3" />
  <text x="60" y="244" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="600" >EXP</text>
  <text x="360" y="244" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="normal" >42 commits to next stage</text>
  <rect x="60" y="250" width="300" height="14" rx="7" fill="#f1f5f9" />
  <clipPath id="xpClip"><rect x="60" y="250" width="300" height="14" rx="7" /></clipPath>
  <rect x="60" y="250" width="258.0" height="14" rx="7" fill="url(#xpBarGrad)" clip-path="url(#xpClip)" />
  <text x="210.0" y="286" font-size="12" fill="#8870a4" text-anchor="middle" font-weight="700" >458 total commits</text>
  <line x1="60" y1="305" x2="360" y2="305" stroke="url(#purpleMintGradH)" stroke-width="1.5" stroke-opacity="0.3" />
</svg>