<svg xmlns="http://www.w3.org/2000/svg" width="390" height="260" viewBox="0 0 390 260">
  <defs>
    <linearGradient id="purpleMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#8870a4" />
    </linearGradient>
    <linearGradient id="purpleMintGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8870a4" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8870a4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5A5070" flood-opacity="0.08"/>
    </filter>
    
    <linearGradient id="xpBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
    
    @keyframes float {
      0% { transform: translateY(-3px); }
      50% { transform: translateY(3px); }
      100% { transform: translateY(-3px); }
    }
    .kaiju-art {
      animation: float 3s ease-in-out infinite;
    }
    
  </style>
  <rect x="0" y="0" width="390" height="260" rx="16" fill="#FAFAFC" filter="url(#cardShadow)"/>
  <rect x="0" y="0" width="390" height="260" rx="16" fill="none" stroke="url(#cardBorderGrad)" stroke-width="1.5" />
  <text x="195.0" y="36" font-size="16" fill="#8870a4" text-anchor="middle" font-weight="700" >🦖  My Kaiju</text>
  <line x1="30" y1="52" x2="360" y2="52" stroke="url(#purpleMintGradH)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4,4" />
  <text x="180" y="100" font-size="18" fill="#8870a4" text-anchor="start" font-weight="800" >Kaiju</text>
  <rect x="180" y="112" width="54" height="20" rx="10" fill="#f5f0f9" />
  <text x="207" y="126" font-size="11" fill="#8870a4" text-anchor="middle" font-weight="800" >Lv. 26</text>
  <text x="244" y="126" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="600" >500 total commits</text>
  <text x="180" y="144" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" >EXP</text>
  <text x="350" y="144" font-size="9" fill="#475569" text-anchor="end" font-weight="normal" >500 commits to next stage</text>
  <rect x="180" y="150" width="170" height="12" rx="6" fill="#f1f5f9" />
  <clipPath id="xpClip"><rect x="180" y="150" width="170" height="12" rx="6" /></clipPath>
  <rect x="180" y="150" width="8" height="12" rx="6" fill="url(#xpBarGrad)" clip-path="url(#xpClip)" />
</svg>