<svg xmlns="http://www.w3.org/2000/svg" width="390" height="240" viewBox="0 0 390 240">
  <defs>
    <linearGradient id="purpleMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#8870a4" />
    </linearGradient>
    <linearGradient id="purpleMintGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8870a4" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8870a4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5A5070" flood-opacity="0.08"/>
    </filter>
    
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#f5f0f9" />
    </linearGradient>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
    
    .cert-card { transition: transform 0.3s ease; }
    .cert-card:hover { transform: translateX(3px); }
    
  </style>
  <rect x="0" y="0" width="390" height="240" rx="16" fill="#FAFAFC" filter="url(#cardShadow)"/>
  <rect x="0" y="0" width="390" height="240" rx="16" fill="none" stroke="url(#cardBorderGrad)" stroke-width="1.5" />
  <text x="195.0" y="36" font-size="16" fill="#8870a4" text-anchor="middle" font-weight="700" >📜  Certifications</text>
  <line x1="30" y1="52" x2="360" y2="52" stroke="url(#purpleMintGradH)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4,4" />
<g class="cert-card" transform="translate(30, 66)">
  <rect x="0" y="0" width="44" height="44" rx="10" fill="#e6f8f5" opacity="0.7" />
<path d="M 12 10 L 32 10 L 32 24 Q 22 36 12 24 Z" fill="none" stroke="#8870a4" stroke-width="2" stroke-linejoin="round" />
  <text x="56" y="18" font-size="13" fill="#8870a4" text-anchor="start" font-weight="700" >応用情報技術者</text>
  <text x="56" y="34" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="500" >Applied IT Engineer</text>
</g>
