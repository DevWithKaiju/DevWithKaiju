<path d="M 12 14 L 12 30 A 10 4 0 0 0 32 30 L 32 14" fill="none" stroke="#8870a4" stroke-width="2" />
<path d="M 12 22 A 10 4 0 0 0 32 22" fill="none" stroke="#8870a4" stroke-width="2" />
  <text x="56" y="18" font-size="13" fill="#8870a4" text-anchor="start" font-weight="700" >データベーススペシャリスト</text>
  <text x="56" y="34" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="500" >Database Specialist</text>
