<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="purpleMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#8870a4" />
    </linearGradient>
    <linearGradient id="purpleMintGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8870a4" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8870a4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5A5070" flood-opacity="0.08"/>
    </filter>
    
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <clipPath id="headerClip">
      <rect x="0" y="0" width="800" height="120" rx="16" />
    </clipPath>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
    
    @keyframes float1 {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
      100% { transform: translateY(0px) scale(1); }
    }
    @keyframes float2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(15px, 5px) scale(0.95); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .blob1 { animation: float1 6s ease-in-out infinite; }
    .blob2 { animation: float2 8s ease-in-out infinite; }
    .star { animation: float1 4s ease-in-out infinite; }
    
  </style>
<g clip-path="url(#headerClip)">
  <rect x="0" y="0" width="800" height="120" rx="0" fill="#f5f0f9" />
<circle class="blob1" cx="100" cy="20" r="60" fill="#FFD6E5" opacity="0.6" filter="url(#blur)" />
<circle class="blob2" cx="700" cy="100" r="80" fill="#2dd4bf" opacity="0.5" filter="url(#blur)" />
<circle class="blob1" cx="400" cy="-30" r="90" fill="#b39cd0" opacity="0.4" filter="url(#blur)" />
<g class="star" transform="translate(60, 40)"><path d="M0,-8 L1.5,-2.5 L8,0 L1.5,2.5 L0,8 L-1.5,2.5 L-8,0 L-1.5,-2.5 Z" fill="#8870a4" opacity="0.4"/></g>
<g class="star" transform="translate(100, 90) scale(0.6)"><path d="M0,-8 L1.5,-2.5 L8,0 L1.5,2.5 L0,8 L-1.5,2.5 L-8,0 L-1.5,-2.5 Z" fill="#8870a4" opacity="0.5"/></g>
<g class="star" transform="translate(740, 50)"><path d="M0,-8 L1.5,-2.5 L8,0 L1.5,2.5 L0,8 L-1.5,2.5 L-8,0 L-1.5,-2.5 Z" fill="#8870a4" opacity="0.3"/></g>
<g class="star" transform="translate(700, 30) scale(0.7)"><path d="M0,-8 L1.5,-2.5 L8,0 L1.5,2.5 L0,8 L-1.5,2.5 L-8,0 L-1.5,-2.5 Z" fill="#8870a4" opacity="0.4"/></g>
  <text x="400.0" y="68.0" font-size="24" fill="#8870a4" text-anchor="middle" font-weight="800" >Bridging Pharmaceutical Sciences &amp; NLP</text>
<line x1="320.0" y1="90" x2="480.0" y2="90" stroke="#b39cd0" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />
  <text x="400.0" y="108" font-size="12" fill="#475569" text-anchor="middle" font-weight="600" >Graduate School of Pharmaceutical Sciences</text>
</g>
  <rect x="0" y="0" width="800" height="120" rx="16" fill="none" stroke="url(#cardBorderGrad)" stroke-width="2" />
</svg>