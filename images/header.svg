<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="purpleMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="purpleMintGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b39cd0" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39cd0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.6" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0f9" />
      <stop offset="100%" stop-color="#e6f8f5" />
    </linearGradient>
    
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, sans-serif; }
    
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(5px) rotate(-5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .star1 { animation: float1 4s ease-in-out infinite; }
    .star2 { animation: float2 5s ease-in-out infinite; }
    
  </style>
  <rect x="0" y="0" width="800" height="120" rx="16" fill="url(#headerGrad)" />
  <rect x="0" y="0" width="800" height="120" rx="16" fill="none" stroke="url(#cardBorderGrad)" stroke-width="2" />
<g class="star1" transform="translate(60, 40)"><path d="M0,-10 L2,-3 L10,0 L2,3 L0,10 L-2,3 L-10,0 L-2,-3 Z" fill="#2dd4bf" opacity="0.6"/></g>
<g class="star2" transform="translate(40, 80)"><circle cx="0" cy="0" r="4" fill="#b39cd0" opacity="0.4"/></g>
<g class="star1" transform="translate(100, 90) scale(0.6)"><path d="M0,-10 L2,-3 L10,0 L2,3 L0,10 L-2,3 L-10,0 L-2,-3 Z" fill="#FFD6E5" opacity="0.8"/></g>
<g class="star2" transform="translate(740, 50)"><path d="M0,-10 L2,-3 L10,0 L2,3 L0,10 L-2,3 L-10,0 L-2,-3 Z" fill="#b39cd0" opacity="0.5"/></g>
<g class="star1" transform="translate(760, 90)"><circle cx="0" cy="0" r="3" fill="#2dd4bf" opacity="0.5"/></g>
<g class="star2" transform="translate(700, 30) scale(0.7)"><path d="M0,-10 L2,-3 L10,0 L2,3 L0,10 L-2,3 L-10,0 L-2,-3 Z" fill="#FFD6E5" opacity="0.7"/></g>
  <text x="400.0" y="68.0" font-size="24" fill="#8870a4" text-anchor="middle" font-weight="800" >Bridging Pharmaceutical Sciences &amp; NLP</text>
<line x1="300.0" y1="90" x2="500.0" y2="90" stroke="#b39cd0" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />
  <text x="400.0" y="108" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="600" >Graduate School of Pharmaceutical Sciences</text>
</svg>